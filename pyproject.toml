[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hep_tracking"
version = "1.0.0"
description = "Benchmarking kNN and ANN methods for HEP track segment building"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.5",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "tqdm>=4.68.4",
    "ipykernel>=7.3.0",
    "xgboost>=3.3.0 ",
    "lightgbm>=4.7.0",
    "hnswlib>=0.8.0",
    "faiss-cpu>=1.14.3"
]

[project.optional-dependencies]

gpu = [
    "cupy-cuda12x>=12.0.0",
    "faiss-gpu>=1.14.3; sys_platform != 'win32'"
]

dev = [
    "pytest>=9.1.1",
    "black>=26.5.1",
    "isort>=8.0.1",
    "jupyter>=1.1.1"
]

docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]