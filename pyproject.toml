[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hep_tracking"
version = "0.1.0"
description = "Benchmarking kNN and ANN methods for HEP track segment building"

requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "hnswlib",
    "faiss-cpu",
    "ipykernel",
    "xgboost",
    "lightgbm",
    "pandas",
    "seaborn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "jupyter"
]
# Opcjonalne - wymaga karty NVIDIA i zainstalowanego CUDA Toolkit.
# Zainstaluj TYLKO jeśli masz dostępne GPU: pip install -e ".[gpu]"
# Uwaga: cupy wymaga wersji dopasowanej do Twojego CUDA (np. cupy-cuda12x),
# zobacz https://docs.cupy.dev/en/stable/install.html - podana tu nazwa
# "cupy" spróbuje budować się ze źródeł bez wskazania wersji.
# faiss-gpu bywa niestabilne przez pip - w razie problemów zainstaluj przez
# conda: conda install -c pytorch -c nvidia faiss-gpu
gpu = [
    "cupy-cuda12x",
    "faiss-gpu",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]